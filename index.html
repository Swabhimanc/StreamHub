<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StreamBox — an attractive video streaming platform demo powered by TMDB." />
    <title>StreamBox — Watch Movies & TV</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function (location) {
        if (!location.search.startsWith('?/')) return
        const decoded = location.search
          .slice(2)
          .split('&')
          .map((part) => part.replace(/~and~/g, '&'))
          .join('?')
        window.history.replaceState(null, '', location.pathname.replace(/\/$/, '') + '/' + decoded + location.hash)
      })(window.location)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
